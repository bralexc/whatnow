name: Windows calendar preview

on:
  push:
    branches: [feat/google-calendar-oauth-api-key]
    paths:
      - '.github/workflows/windows-preview.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Build and embed the web UI
        shell: pwsh
        run: |
          Push-Location web
          npm ci
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Pop-Location
          Get-ChildItem internal/web/dist -Force | Where-Object Name -ne '.gitkeep' | Remove-Item -Recurse -Force
          Copy-Item web/build/* internal/web/dist -Recurse -Force
      - name: Build Windows executable and check startup
        shell: pwsh
        env:
          CGO_ENABLED: '0'
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          $version = 'google-calendar-' + $env:GITHUB_SHA.Substring(0, 7)
          go build -trimpath -ldflags "-s -w -X main.Version=$version" -o dist/whatnow-windows-amd64.exe ./cmd/whatnow
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $actual = & ./dist/whatnow-windows-amd64.exe version
          if ($LASTEXITCODE -ne 0 -or $actual -ne $version) { throw 'Executable version check failed' }
          $hash = (Get-FileHash dist/whatnow-windows-amd64.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  whatnow-windows-amd64.exe" | Set-Content dist/SHA256SUMS.txt
      - uses: actions/upload-artifact@v4
        with:
          name: whatnow-windows-amd64
          path: |
            dist/whatnow-windows-amd64.exe
            dist/SHA256SUMS.txt
      - name: Publish preview download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $tag = 'windows-google-calendar-' + $env:GITHUB_SHA.Substring(0, 7)
          @"
          Windows x64 preview of the Google Calendar OAuth/API-key changes in PR #1.
          Built from commit $env:GITHUB_SHA. This preview is not a release from main.

          Download whatnow-windows-amd64.exe. In PowerShell, run:
              .\whatnow-windows-amd64.exe serve
          Then open http://127.0.0.1:7777 and go to Settings → Integrations → Google Calendar.
          "@ | Set-Content release-notes.md
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $tag dist/whatnow-windows-amd64.exe dist/SHA256SUMS.txt --clobber --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create $tag dist/whatnow-windows-amd64.exe dist/SHA256SUMS.txt --target $env:GITHUB_SHA --title "Windows preview: Google Calendar connections" --notes-file release-notes.md --prerelease --latest=false --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
